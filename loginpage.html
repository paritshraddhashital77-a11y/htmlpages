<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #004999; }
        .links { margin-top: 10px; font-size: 12px; text-align: center; }
        .links a { color: #0066cc; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Login</h2>
        <form action="#" method="POST">
            <label>Full Name:</label>
            <input type="Full Name" name="Full Name" required>
            <label>Email:</label>
            <input type="Email" name="Email" required>
            <label>Password:</label>
             <input type="password" name="password" required>
             <label>City:</label>
             <input type="city" name="city" required>
             <label>Mobile number:</label>
             <input type="Mobile number" name="Mobile number" required>
            <button type="submit">Submit</button>
            
             <button type="submit">Log In</button>

        </form>
        <div class="links">
            <a href="forgot-password.html">Forgot Password?</a> | <a href="index.html">Home</a>
        </div>
    </div>
</body>
</html>
